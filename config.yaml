# config.yaml
app:
  name: "yaice-game-server"
  version: "1.0.0"
  env: "development"
  debug: true

log:
  level: "info"
  path: "./logs"
  max_size: 100
  max_backups: 10
  max_age: 7
  compress: true

network:
  # 启用TCP协议（游戏主协议）
  tcp:
    enabled: true
    host: "0.0.0.0"
    port: 8080
    max_conn: 10000
    read_timeout: 30s
    write_timeout: 30s

  # 启用KCP协议（用于高延迟网络优化）
  kcp:
    enabled: true
    host: "0.0.0.0"
    port: 8081
    max_conn: 5000
    data_shard: 10
    parity_shard: 3
    no_delay: 1
    interval: 20
    resend: 2
    nc: 1
    snd_wnd: 1024
    rcv_wnd: 1024
    mtu: 1350
    ack_nodelay: true
    write_timeout: 30s
    read_timeout: 30s

  # 启用HTTP协议（用于管理接口）
  http:
    enabled: true
    host: "0.0.0.0"
    port: 8082
    read_timeout: 30s
    write_timeout: 30s
    idle_timeout: 120s
    max_header_bytes: 1048576
    enable_tls: false
    enable_cors: true
    cors_origins: ["*"]
    enable_gzip: true
    gzip_level: 6
    enable_metrics: true
    metrics_path: "/metrics"
    enable_pprof: true
    pprof_prefix: "/debug/pprof"

database:
  # 启用MongoDB（主数据库）
  mongodb:
    enabled: true
    uri: "mongodb://localhost:27017"
    database: "yaice_game"
    max_pool_size: 100
    min_pool_size: 10
    timeout: 10s
